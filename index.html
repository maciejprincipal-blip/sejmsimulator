<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Sejm 5.0</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#eef2ff;
}

.topbar{
  background:#111827;
  color:white;
  padding:12px;
  text-align:center;
  font-weight:bold;
}

.container{
  display:flex;
  justify-content:center;
  padding:20px;
}

.panel{
  background:white;
  padding:20px;
  width:450px;
  border-radius:12px;
  box-shadow:0 0 15px rgba(0,0,0,0.15);
}

button,select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
}

.blue{background:#2563eb;color:white;}
.green{background:#16a34a;color:white;}
.red{background:#dc2626;color:white;}
.dark{background:#111827;color:white;}
.orange{background:#ea580c;color:white;}

.seats{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:3px;
  margin-top:10px;
}

.seat{
  width:14px;
  height:14px;
  background:#9ca3af;
  border-radius:2px;
}

.active{background:#22c55e;}

.lock{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:black;
  color:white;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-size:26px;
  z-index:999;
}

.timer{
  font-size:20px;
  margin-top:10px;
  color:#fbbf24;
}
</style>
</head>

<body>

<div class="topbar">🏛️ SEJM 5.0</div>

<div id="menu" class="container">
  <div class="panel">
    <h2>Wybierz ekran</h2>
    <button class="blue" onclick="start('marshal')">🟦 Marszałek</button>
    <button class="green" onclick="start('mp')">🟩 Poseł</button>
  </div>
</div>

<!-- MARSZAŁEK -->
<div id="marshalPanel" style="display:none;">
  <div class="topbar">🟦 MARSZAŁEK</div>

  <div class="container">
    <div class="panel">

      <select id="bill">
        <option>Ustawa budżetowa</option>
        <option>Ustawa edukacyjna</option>
        <option>Ustawa bezpieczeństwa</option>
      </select>

      <button class="blue" onclick="startVote()">🗳️ Start głosowania</button>
      <button class="red" onclick="endVote()">🛑 Koniec głosowania</button>

      <button class="orange" onclick="toggleMic()">🎤 Mikrofon mównicy</button>

      <button class="dark" onclick="lockAll()">🔒 Zablokuj posłów</button>
      <button class="green" onclick="unlockAll()">🔓 Odblokuj posłów</button>

      <select id="breakTime">
        <option value="10">10s</option>
        <option value="20">20s</option>
        <option value="60">1 min</option>
        <option value="300">5 min</option>
        <option value="600">10 min</option>
        <option value="900">15 min</option>
        <option value="1200">20 min</option>
        <option value="1500">25 min</option>
        <option value="1800">30 min</option>
      </select>

      <button class="dark" onclick="startBreak()">⏸️ Przerwa</button>

      <button class="red" onclick="callGuard()">🚨 Straż Marszałkowska</button>

      <div id="status" style="margin-top:10px;font-weight:bold;">Gotowy</div>

      <div class="seats" id="seats"></div>
    </div>
  </div>
</div>

<!-- POSEŁ -->
<div id="mpPanel" style="display:none;">
  <div class="topbar">🟩 POSEŁ</div>

  <div class="container">
    <div class="panel">

      <div id="voteInfo">Brak głosowania</div>

      <button class="blue" onclick="vote('ZA')">👍 ZA</button>
      <button class="red" onclick="vote('PRZECIW')">👎 PRZECIW</button>

      <button class="green" onclick="emergencyUnlock()">🚨 Awaryjne odblokowanie</button>

      <div id="mpStatus">Oczekiwanie...</div>
    </div>
  </div>

  <div class="lock" id="lock">
    PRZERWA | RZECZPOSPOLITA POLSKA
    <div class="timer" id="timer"></div>
  </div>
</div>

<script>

const ch = new BroadcastChannel("sejm");

let role="";
let timerInterval=null;

// ===== START =====
function start(r){
  role=r;
  document.getElementById("menu").style.display="none";

  if(role==="marshal"){
    document.getElementById("marshalPanel").style.display="block";
    createSeats();
  }

  if(role==="mp"){
    document.getElementById("mpPanel").style.display="block";
  }
}

// ===== SALA =====
function createSeats(){
  const s=document.getElementById("seats");
  for(let i=0;i<120;i++){
    let d=document.createElement("div");
    d.className="seat";
    s.appendChild(d);
  }
}

// ===== DŹWIĘK =====
function beep(){
  const ctx=new AudioContext();
  const o=ctx.createOscillator();
  o.frequency.value=700;
  o.connect(ctx.destination);
  o.start();
  setTimeout(()=>o.stop(),150);
}

// ===== GŁOSOWANIE =====
function startVote(){
  ch.postMessage({type:"start", bill:document.getElementById("bill").value});
}
function endVote(){
  ch.postMessage({type:"end"});
}
function vote(v){
  ch.postMessage({type:"vote", value:v});
}

// ===== MIKROFON =====
let mic=true;
function toggleMic(){
  mic=!mic;
  ch.postMessage({type:"mic", value:mic});
}

// ===== STRAŻ =====
function callGuard(){
  let p=prompt("Miejsce (1-120 / Mównica / A-E):");
  if(p) ch.postMessage({type:"guard", place:p});
}

// ===== BLOKADA =====
function lockAll(){
  ch.postMessage({type:"lock"});
}

function unlockAll(){
  ch.postMessage({type:"unlock"});
}

// ===== PRZERWA =====
function startBreak(){
  let t=parseInt(document.getElementById("breakTime").value);
  ch.postMessage({type:"break", time:t});
}

// ===== AWARYJNE =====
function emergencyUnlock(){
  let pass=prompt("Hasło Marszałka:");
  if(pass==="245516364"){
    ch.postMessage({type:"unlock"});
  } else alert("BŁĘDNE HASŁO");
}

// ===== ODBIÓR =====
ch.onmessage=(e)=>{

  if(role==="mp"){

    if(e.data.type==="lock"){
      document.getElementById("lock").style.display="flex";
    }

    if(e.data.type==="unlock"){
      document.getElementById("lock").style.display="none";
    }

    if(e.data.type==="break"){
      let time=e.data.time;
      document.getElementById("lock").style.display="flex";

      clearInterval(timerInterval);

      timerInterval=setInterval(()=>{
        document.getElementById("timer").innerText=time+"s";
        time--;

        if(time<0){
          clearInterval(timerInterval);
          document.getElementById("lock").style.display="none";
        }

      },1000);
    }

    if(e.data.type==="start"){
      document.getElementById("voteInfo").innerText="Głosowanie: "+e.data.bill;
    }

    if(e.data.type==="end"){
      document.getElementById("voteInfo").innerText="Zakończone";
    }

    if(e.data.type==="guard"){
      document.getElementById("mpStatus").innerText="Straż: "+e.data.place;
    }
  }
};

</script>

</body>
</html>

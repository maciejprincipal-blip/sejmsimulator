<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Sejm Symulator 2.0</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f3f4f6;
}

.topbar {
  background: #111827;
  color: white;
  padding: 12px;
  text-align: center;
  font-weight: bold;
  font-size: 18px;
}

.container {
  display: flex;
  justify-content: center;
  padding: 30px;
}

.panel {
  background: white;
  padding: 20px;
  width: 420px;
  border-radius: 12px;
  box-shadow: 0 0 15px rgba(0,0,0,0.15);
}

button, select {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
}

.marszalek { background: #2563eb; color: white; }
.posel { background: #16a34a; color: white; }
.red { background: #dc2626; color: white; }
.orange { background: #ea580c; color: white; }
.purple { background: #9333ea; color: white; }
.dark { background: #111827; color: white; }

.lock {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  color: white;
  display: none;
  justify-content: center;
  align-items: center;
  font-size: 30px;
  z-index: 999;
  flex-direction: column;
}

.status {
  margin-top: 15px;
  padding: 10px;
  background: #e5e7eb;
  border-radius: 6px;
  font-weight: bold;
}

.seats {
  display: grid;
  grid-template-columns: repeat(12,1fr);
  gap: 4px;
  margin-top: 15px;
}

.seat {
  width: 18px;
  height: 18px;
  background: #9ca3af;
  border-radius: 3px;
}

.active {
  background: #22c55e;
  transform: scale(1.2);
}

.warning {
  background: #fef3c7;
  padding: 10px;
  border-radius: 6px;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="topbar">🏛️ SYSTEM SEJMU 2.0</div>

<div class="container">
  <div class="panel">

    <h2>Wybierz ekran</h2>

    <button class="marszalek" onclick="start('marshal')">
      🟦 Marszałek
    </button>

    <button class="posel" onclick="start('mp')">
      🟩 Poseł
    </button>

  </div>
</div>

<div class="lock" id="lock">
🔒 POSIEDZENIE NIEJAWNE<br>
MONITOR ZABLOKOWANY
</div>

<script>

const channel = new BroadcastChannel("sejm");
let role = "";
let votesFor = 0;
let votesAgainst = 0;
let mic = true;

function playBell(){
  const ctx = new(window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  osc.frequency.value = 700;
  osc.connect(ctx.destination);
  osc.start();
  setTimeout(()=>osc.stop(),200);
}

function start(r){
  role = r;

  // ================= MARSZAŁEK =================
  if(role === "marshal"){

    document.body.innerHTML = `
      <div class="topbar">🟦 PANEL MARSZAŁKA</div>

      <div class="container">
        <div class="panel">

          <select id="bill">
            <option>Ustawa budżetowa</option>
            <option>Ustawa o szkołach</option>
            <option>Ustawa o internecie</option>
          </select>

          <button class="marszalek" onclick="startVote()">🗳️ Rozpocznij głosowanie</button>

          <button class="red" onclick="endVote()">🛑 Zakończ głosowanie</button>

          <button class="orange" onclick="toggleMic()">🎤 Mikrofon mównicy</button>

          <button class="purple" onclick="callGuard()">🚨 Straż Marszałkowska</button>

          <button class="dark" onclick="lockAll()">🔒 Rozpocznij posiedzenie niejawne</button>

          <div class="status" id="status">
            System gotowy
          </div>

          <div class="warning">
            ZA: <span id="za">0</span><br>
            PRZECIW: <span id="przeciw">0</span>
          </div>

          <div class="seats" id="seats"></div>

        </div>
      </div>
    `;

    createSeats();
  }

  // ================= POSEŁ =================
  if(role === "mp"){

    document.body.innerHTML = `
      <div class="topbar">🟩 PANEL POSŁA</div>

      <div class="container">
        <div class="panel">

          <h3>Stan obrad</h3>

          <div id="voteInfo">Brak aktywnego głosowania</div>

          <button class="marszalek" onclick="sendVote('ZA')">👍 Głos ZA</button>

          <button class="red" onclick="sendVote('PRZECIW')">👎 Głos PRZECIW</button>

          <div class="status" id="mpStatus">
            Oczekiwanie na decyzje Marszałka
          </div>

        </div>
      </div>

      <div class="lock" id="lock">
        🔒 MONITOR ZABLOKOWANY PRZEZ MARSZAŁKA
      </div>
    `;
  }
}

// ================= SALA OBRAD =================
function createSeats(){
  const seats = document.getElementById("seats");

  for(let i=0;i<120;i++){
    const seat = document.createElement("div");
    seat.className = "seat";
    seats.appendChild(seat);
  }
}

// ================= GŁOSOWANIE =================
function startVote(){
  const bill = document.getElementById("bill").value;

  playBell();

  document.getElementById("status").innerHTML =
    "🗳️ Rozpoczęto głosowanie: " + bill;

  channel.postMessage({
    type:"voteStart",
    bill: bill
  });
}

function endVote(){
  playBell();

  document.getElementById("status").innerHTML =
    "🛑 Głosowanie zakończone";

  channel.postMessage({
    type:"voteEnd"
  });
}

// ================= POSEŁ GŁOSUJE =================
function sendVote(v){
  channel.postMessage({
    type:"vote",
    value:v
  });
}

// ================= MIKROFON =================
function toggleMic(){
  mic = !mic;

  playBell();

  document.getElementById("status").innerHTML =
    mic
    ? "🎤 Mikrofon WŁĄCZONY"
    : "🔇 Mikrofon WYŁĄCZONY";

  channel.postMessage({
    type:"mic",
    active:mic
  });
}

// ================= STRAŻ =================
function callGuard(){
  const place = prompt(
    "Podaj miejsce:
1-120
Mównica
Ława rządowa
Wyjście A/B/C/D/E"
  );

  if(place){
    playBell();

    document.getElementById("status").innerHTML =
      "🚨 Straż wysłana do: " + place;

    channel.postMessage({
      type:"guard",
      place:place
    });
  }
}

// ================= NIEJAWNE =================
function lockAll(){
  playBell();

  document.getElementById("status").innerHTML =
    "🔒 Posiedzenie niejawne rozpoczęte";

  channel.postMessage({
    type:"lock"
  });
}

// ================= ODBIÓR =================
channel.onmessage = (e) => {

  // ===== POSEŁ =====
  if(role === "mp"){

    if(e.data.type === "lock"){
      document.getElementById("lock").style.display = "flex";
    }

    if(e.data.type === "voteStart"){
      document.getElementById("voteInfo").innerHTML =
        "🗳️ Trwa głosowanie:<br><b>" + e.data.bill + "</b>";

      playBell();
    }

    if(e.data.type === "voteEnd"){
      document.getElementById("voteInfo").innerHTML =
        "🛑 Głosowanie zakończone";
    }

    if(e.data.type === "mic"){
      document.getElementById("mpStatus").innerHTML =
        e.data.active
        ? "🎤 Mikrofon aktywny"
        : "🔇 Mikrofon wyłączony";
    }

    if(e.data.type === "guard"){
      document.getElementById("mpStatus").innerHTML =
        "🚨 Straż Marszałkowska: " + e.data.place;
    }
  }

  // ===== MARSZAŁEK =====
  if(role === "marshal"){

    if(e.data.type === "vote"){

      if(e.data.value === "ZA"){
        votesFor++;
      }

      if(e.data.value === "PRZECIW"){
        votesAgainst++;
      }

      document.getElementById("za").innerText = votesFor;
      document.getElementById("przeciw").innerText = votesAgainst;

      const seats = document.querySelectorAll(".seat");

      if(seats[votesFor + votesAgainst - 1]){
        seats[votesFor + votesAgainst - 1].classList.add("active");
      }
    }
  }
};

</script>

</body>
</html>

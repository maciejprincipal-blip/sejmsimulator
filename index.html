<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Sejm Symulator 3.0</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f3f4f6;
}

.topbar {
  background: #111827;
  color: white;
  padding: 12px;
  text-align: center;
  font-weight: bold;
}

.container {
  display: flex;
  justify-content: center;
  padding: 30px;
}

.panel {
  background: white;
  padding: 20px;
  width: 420px;
  border-radius: 12px;
  box-shadow: 0 0 15px rgba(0,0,0,0.15);
}

button, select {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
}

.marszalek { background: #2563eb; color: white; }
.posel { background: #16a34a; color: white; }
.red { background: #dc2626; color: white; }
.orange { background: #ea580c; color: white; }
.dark { background: #111827; color: white; }

.lock {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: black;
  color: white;
  display: none;
  justify-content: center;
  align-items: center;
  font-size: 28px;
  flex-direction: column;
  z-index: 999;
}

.seats {
  display: grid;
  grid-template-columns: repeat(12,1fr);
  gap: 4px;
  margin-top: 10px;
}

.seat {
  width: 16px;
  height: 16px;
  background: #9ca3af;
  border-radius: 3px;
}

.active {
  background: #22c55e;
}
</style>
</head>

<body>

<div class="topbar">🏛️ SEJM SYSTEM</div>

<!-- MENU -->
<div id="menu" class="container">
  <div class="panel">

    <h2>Wybierz ekran</h2>

    <button class="marszalek" onclick="start('marshal')">
      🟦 Marszałek
    </button>

    <button class="posel" onclick="start('mp')">
      🟩 Poseł
    </button>

  </div>
</div>

<!-- MARSZAŁEK -->
<div id="marshalPanel" style="display:none;">
  <div class="topbar">🟦 MARSZAŁEK</div>

  <div class="container">
    <div class="panel">

      <select id="bill">
        <option>Ustawa budżetowa</option>
        <option>Ustawa o edukacji</option>
        <option>Ustawa o internecie</option>
      </select>

      <button class="marszalek" onclick="startVote()">🗳️ Start głosowania</button>
      <button class="red" onclick="endVote()">🛑 Zakończ głosowanie</button>
      <button class="orange" onclick="toggleMic()">🎤 Mikrofon</button>
      <button class="dark" onclick="lockAll()">🔒 Posiedzenie niejawne</button>

      <div id="status" style="margin-top:10px;font-weight:bold;">
        System gotowy
      </div>

      <div class="seats" id="seats"></div>

    </div>
  </div>
</div>

<!-- POSEŁ -->
<div id="mpPanel" style="display:none;">
  <div class="topbar">🟩 POSEŁ</div>

  <div class="container">
    <div class="panel">

      <div id="voteInfo">Brak głosowania</div>

      <button class="marszalek" onclick="sendVote('ZA')">👍 ZA</button>
      <button class="red" onclick="sendVote('PRZECIW')">👎 PRZECIW</button>

      <div id="mpStatus" style="margin-top:10px;">
        Oczekiwanie na Marszałka
      </div>

    </div>
  </div>

  <div class="lock" id="lock">
    🔒 POSIEDZENIE NIEJAWNE
  </div>
</div>

<script>

const channel = new BroadcastChannel("sejm");

let role = "";
let votesFor = 0;
let votesAgainst = 0;
let mic = true;

// ===== START =====
function start(r){
  role = r;

  document.getElementById("menu").style.display = "none";

  if(role === "marshal"){
    document.getElementById("marshalPanel").style.display = "block";
    createSeats();
  }

  if(role === "mp"){
    document.getElementById("mpPanel").style.display = "block";
  }
}

// ===== SALA =====
function createSeats(){
  const s = document.getElementById("seats");

  for(let i=0;i<120;i++){
    const d = document.createElement("div");
    d.className = "seat";
    s.appendChild(d);
  }
}

// ===== DŹWIĘK =====
function bell(){
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const o = ctx.createOscillator();
  o.frequency.value = 700;
  o.connect(ctx.destination);
  o.start();
  setTimeout(()=>o.stop(),150);
}

// ===== MARSZAŁEK =====
function startVote(){
  const bill = document.getElementById("bill").value;
  bell();

  channel.postMessage({type:"voteStart", bill});
  document.getElementById("status").innerText = "Głosowanie: " + bill;
}

function endVote(){
  bell();
  channel.postMessage({type:"voteEnd"});
  document.getElementById("status").innerText = "Głosowanie zakończone";
}

function toggleMic(){
  mic = !mic;
  bell();

  channel.postMessage({type:"mic", value:mic});
  document.getElementById("status").innerText =
    mic ? "🎤 Mikrofon ON" : "🔇 Mikrofon OFF";
}

function lockAll(){
  bell();
  channel.postMessage({type:"lock"});
  document.getElementById("status").innerText = "🔒 Niejawne posiedzenie";
}

// ===== POSEŁ =====
function sendVote(v){
  channel.postMessage({type:"vote", value:v});
}

// ===== ODBIÓR =====
channel.onmessage = (e) => {

  // POSEŁ
  if(role === "mp"){

    if(e.data.type === "lock"){
      document.getElementById("lock").style.display = "flex";
    }

    if(e.data.type === "voteStart"){
      document.getElementById("voteInfo").innerHTML =
        "🗳️ Głosowanie: <b>" + e.data.bill + "</b>";
      bell();
    }

    if(e.data.type === "voteEnd"){
      document.getElementById("voteInfo").innerText = "Zakończone";
    }

    if(e.data.type === "mic"){
      document.getElementById("mpStatus").innerText =
        e.data.value ? "🎤 Mikrofon ON" : "🔇 Mikrofon OFF";
    }
  }

  // MARSZAŁEK
  if(role === "marshal"){

    if(e.data.type === "vote"){
      if(e.data.value === "ZA") votesFor++;
      if(e.data.value === "PRZECIW") votesAgainst++;

      document.getElementById("status").innerText =
        `ZA: ${votesFor} | PRZECIW: ${votesAgainst}`;

      const seats = document.querySelectorAll(".seat");
      const i = votesFor + votesAgainst - 1;
      if(seats[i]) seats[i].classList.add("active");
    }
  }
};

</script>

</body>
</html>

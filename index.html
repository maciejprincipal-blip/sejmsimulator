<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Sejm 7.0</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#eef2ff;
}

.topbar{
  background:#111827;
  color:white;
  padding:12px;
  text-align:center;
  font-weight:bold;
}

.container{
  display:flex;
  justify-content:center;
  padding:20px;
}

.panel{
  background:white;
  padding:20px;
  width:460px;
  border-radius:12px;
  box-shadow:0 0 15px rgba(0,0,0,0.15);
}

button,select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
}

.blue{background:#2563eb;color:white;}
.green{background:#16a34a;color:white;}
.red{background:#dc2626;color:white;}
.dark{background:#111827;color:white;}
.orange{background:#ea580c;color:white;}

.lock{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:black;
  color:white;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-size:26px;
  text-align:center;
  z-index:999;
}

.timer{
  margin-top:10px;
  font-size:20px;
  color:#fbbf24;
}
</style>
</head>

<body>

<div class="topbar">🏛️ SEJM 7.0</div>

<!-- MENU -->
<div id="menu" class="container">
  <div class="panel">
    <h2>Wybierz rolę</h2>
    <button class="blue" onclick="start('marshal')">🟦 Marszałek</button>
    <button class="green" onclick="start('mp')">🟩 Poseł</button>
  </div>
</div>

<!-- MARSZAŁEK -->
<div id="marshalPanel" style="display:none;">
  <div class="topbar">🟦 MARSZAŁEK</div>

  <div class="container">
    <div class="panel">

      <select id="bill">
        <option>Ustawa budżetowa</option>
        <option>Ustawa edukacyjna</option>
        <option>Ustawa bezpieczeństwa</option>
      </select>

      <button class="blue" onclick="startVote()">🗳️ Start głosowania</button>
      <button class="red" onclick="endVote()">🛑 Zakończ głosowanie</button>

      <button class="orange" onclick="toggleMic()">🎤 Mikrofon</button>

      <button class="dark" onclick="lockAll()">🔒 Blokada</button>
      <button class="green" onclick="unlockAll()">🔓 Odblokuj</button>

      <select id="breakTime">
        <option value="10">10s</option>
        <option value="20">20s</option>
        <option value="60">1m</option>
        <option value="300">5m</option>
        <option value="600">10m</option>
        <option value="900">15m</option>
        <option value="1200">20m</option>
        <option value="1500">25m</option>
        <option value="1800">30m</option>
      </select>

      <button class="dark" onclick="startBreak()">⏸️ Przerwa</button>

      <button class="red" onclick="permaLock()">⛔ PERMA LOCK</button>
      <button class="green" onclick="removePermaLock()">🔓 Usuń PERMA LOCK</button>

      <div id="status" style="margin-top:10px;font-weight:bold;">Gotowy</div>

      <div id="tribunePanel" style="margin-top:10px;"></div>

    </div>
  </div>
</div>

<!-- POSEŁ -->
<div id="mpPanel" style="display:none;">
  <div class="topbar">🟩 POSEŁ</div>

  <div class="container">
    <div class="panel">

      <div id="voteInfo">Brak głosowania</div>

      <button class="blue" onclick="vote('ZA')">👍 ZA</button>
      <button class="red" onclick="vote('PRZECIW')">👎 PRZECIW</button>

      <button class="orange" onclick="requestTribune()">🎤 Chcę do mównicy</button>

      <button class="green" onclick="emergencyUnlock()">🚨 Awaryjne odblokowanie</button>

      <div id="mpStatus"></div>
    </div>
  </div>

  <div class="lock" id="lock">
    SYSTEM ZABLOKOWANY
    <div class="timer" id="timer"></div>
  </div>
</div>

<script>

const ch = new BroadcastChannel("sejm");

let role="";
let timerInterval=null;
let perma = localStorage.getItem("perma") === "true";

// ===== START =====
function start(r){
  role=r;
  document.getElementById("menu").style.display="none";

  if(role==="marshal"){
    document.getElementById("marshalPanel").style.display="block";
  }

  if(role==="mp"){
    document.getElementById("mpPanel").style.display="block";

    if(perma){
      lockScreen("BLOKADA STAŁA");
    }
  }
}

// ===== LOCK UI =====
function lockScreen(text){
  document.getElementById("lock").style.display="flex";
  document.getElementById("timer").innerText=text;
}

// ===== MARSZAŁEK =====
function startVote(){
  ch.postMessage({type:"start", bill:bill.value});
}

function endVote(){
  ch.postMessage({type:"end"});
}

function vote(v){
  ch.postMessage({type:"vote", value:v});
}

function toggleMic(){
  ch.postMessage({type:"mic"});
}

function lockAll(){
  ch.postMessage({type:"lock"});
}

function unlockAll(){
  ch.postMessage({type:"unlock"});
}

// ===== PRZERWA =====
function startBreak(){
  ch.postMessage({
    type:"break",
    time:parseInt(breakTime.value)
  });
}

// ===== PERMA =====
function permaLock(){
  perma=true;
  localStorage.setItem("perma","true");
  ch.postMessage({type:"permalock"});
}

function removePermaLock(){
  perma=false;
  localStorage.setItem("perma","false");
  ch.postMessage({type:"unpermalock"});
}

// ===== MÓWNICA =====
function requestTribune(){
  ch.postMessage({type:"tribuneRequest"});
  mpStatus.innerText="Wysłano prośbę...";
}

// ===== AWARYJNE =====
function emergencyUnlock(){
  let p=prompt("Hasło:");
  if(p==="245516364"){
    removePermaLock();
    ch.postMessage({type:"unlock"});
  }
}

// ===== ODBIÓR =====
ch.onmessage=(e)=>{

  // POSEŁ
  if(role==="mp"){

    if(e.data.type==="lock") lockScreen("BLOKADA");

    if(e.data.type==="unlock")
      document.getElementById("lock").style.display="none";

    if(e.data.type==="permalock")
      lockScreen("BLOKADA STAŁA");

    if(e.data.type==="unpermalock")
      document.getElementById("lock").style.display="none";

    if(e.data.type==="break"){
      let t=e.data.time;
      lockScreen("PRZERWA");

      clearInterval(timerInterval);

      timerInterval=setInterval(()=>{
        timer.innerText=t+"s";
        t--;
        if(t<0){
          clearInterval(timerInterval);
          document.getElementById("lock").style.display="none";
        }
      },1000);
    }

    if(e.data.type==="tribuneResponse"){
      if(e.data.value){
        mpStatus.innerText="✔ Marszałek pozwolił (10s)";
      } else {
        mpStatus.innerText="❌ Marszałek odmówił (10s)";
      }

      setTimeout(()=>mpStatus.innerText="",10000);
    }
  }

  // MARSZAŁEK
  if(role==="marshal"){

    if(e.data.type==="tribuneRequest"){
      tribunePanel.innerHTML=`
        🟨 Poseł chce do mównicy<br>
        <button onclick="respond(true)">✔</button>
        <button onclick="respond(false)">❌</button>
      `;
    }
  }
};

// ===== MARSZAŁEK ODPOWIEDŹ =====
function respond(v){
  ch.postMessage({type:"tribuneResponse", value:v});
  tribunePanel.innerHTML="";
}

</script>

</body>
</html>
